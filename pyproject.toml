[project]
name = "font-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OpinionatedDeer", email = "mriganshchaudhary@tutamail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.65.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
font-generator = "font_generator:main"
font-viewer = "font_generator.font_viewer:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
